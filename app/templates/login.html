<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gerenciamento de Backlog - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <main class="login-card">
        <header class="brand-header">
            <div class="brand-logo">TBD</div>
            <h1 class="brand-title">Sistema de Gerenciamento de Backlog</h1>
            <p class="brand-subtitle">Entre com suas credenciais para acessar</p>
        </header>

        <form onsubmit="event.preventDefault();">
            <div class="form-group">
                <label for="username" class="form-label">Usuário ou E-mail</label>
                <input
                    type="text"
                    id="username"
                    class="form-input"
                    placeholder="seu@email.com"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Senha</label>
                <input
                    type="password"
                    id="password"
                    class="form-input"
                    placeholder="••••••••"
                    required
                    autocomplete="current-password"
                >
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox"> Lembrar-me
                </label>
            </div>

            <button type="submit" class="btn-submit">Entrar</button>
        </form>

        <footer class="register-footer">
            Não tem uma conta? <a href="register" class="register-link">Cadastre-se</a>
        </footer>
    </main>
</body>
